<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>오늘 할 일</h1>

  <section class="progress">
    <p id="progress-label">오늘 달성률 0/0 · 0%</p>
    <div class="progress-track" id="progress-track" role="progressbar" aria-labelledby="progress-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </section>

  <input type="text" id="todo-input" placeholder="할 일을 적어 주세요">
  <div class="when">
    <label>우선순위
      <select id="todo-priority">
        <option value="high">높음</option>
        <option value="mid" selected>중간</option>
        <option value="low">낮음</option>
      </select>
    </label>
    <label>카테고리
      <input type="text" id="todo-category" list="category-options" placeholder="예: 공부">
      <datalist id="category-options"></datalist>
    </label>
    <label>마감 날짜 <input type="date" id="todo-date"></label>
    <label>마감 시간 <input type="time" id="todo-time"></label>
  </div>

  <button type="button" id="add-button">추가</button>

  <input type="search" id="search-input" placeholder="할 일 검색" aria-label="할 일 검색">

  <div class="filters">
    <div class="status-filters" role="group" aria-label="상태 필터">
      <button type="button" data-status="all" aria-pressed="true">전체</button>
      <button type="button" data-status="active" aria-pressed="false">진행 중</button>
      <button type="button" data-status="done" aria-pressed="false">완료됨</button>
    </div>
    <select id="category-filter" aria-label="카테고리 필터">
      <option value="">전체 카테고리</option>
    </select>
  </div>

  <p id="remaining-count">남은 할 일 0개</p>

  <ul id="todo-list">
    <!-- 할 일이 추가되면 아래 모양이 한 줄씩 들어간다 (지금은 비어 있음)
    <li>
      <input type="checkbox">
      <span>할 일 내용</span>
      <button type="button">삭제</button>
    </li>
    -->
  </ul>

  <p id="empty-message">아직 할 일이 없어요</p>
  <script src="script.js"></script>
</body>
</html>
