<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 할 일</title>
</head>
<body>
  <h1>오늘 할 일</h1>

  <input type="text" id="todo-input" placeholder="할 일을 적어 주세요">
  <button type="button" id="add-button">추가</button>

  <ul id="todo-list">
    <!-- 할 일이 추가되면 아래 모양이 한 줄씩 들어간다 (지금은 비어 있음)
    <li>
      <input type="checkbox">
      <span>할 일 내용</span>
      <button type="button">삭제</button>
    </li>
    -->
  </ul>

  <p id="empty-message">아직 할 일이 없어요</p>
</body>
</html>
