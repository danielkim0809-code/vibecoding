<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>오늘 할 일</h1>

  <input type="text" id="todo-input" placeholder="할 일을 적어 주세요">
  <div class="when">
    <label>우선순위
      <select id="todo-priority">
        <option value="high">높음</option>
        <option value="mid" selected>중간</option>
        <option value="low">낮음</option>
      </select>
    </label>
    <label>날짜 <input type="date" id="todo-date"></label>
    <label>시간 <input type="time" id="todo-time"></label>
  </div>

  <button type="button" id="add-button">추가</button>

  <p id="remaining-count">남은 할 일 0개</p>

  <ul id="todo-list">
    <!-- 할 일이 추가되면 아래 모양이 한 줄씩 들어간다 (지금은 비어 있음)
    <li>
      <input type="checkbox">
      <span>할 일 내용</span>
      <button type="button">삭제</button>
    </li>
    -->
  </ul>

  <p id="empty-message">아직 할 일이 없어요</p>
  <script src="script.js"></script>
</body>
</html>
